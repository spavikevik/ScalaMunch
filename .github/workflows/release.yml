name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release
      packages: write   # publish to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - name: Run tests
        run: sbt test

      - name: Build assembly jars
        run: sbt "cli/assembly" "mcpServer/assembly"

      - name: Publish sbt plugin to GitHub Packages
        run: sbt sbtScalaMunch/publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ScalaMunch ${{ steps.version.outputs.VERSION }}"
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            cli/target/scala-3.3.3/scala-munch-cli-assembly.jar
            mcp-server/target/scala-3.3.3/scala-munch-mcp-assembly.jar
          body: |
            ## Install

            ### Prerequisites
            - Java 21+
            - sbt 1.9+

            ### Quick start
            ```bash
            # Download jars from Assets below, then:
            java -jar scala-munch-cli-assembly.jar build src/main/scala --db .scala-munch.db
            java -jar scala-munch-mcp-assembly.jar --db .scala-munch.db   # MCP server
            ```

            ### sbt plugin
            In `project/plugins.sbt`:
            ```scala
            resolvers += "GitHub Packages" at "https://maven.pkg.github.com/spavikevik/ScalaMunch"
            addSbtPlugin("io.scalamunch" % "sbt-scala-munch" % "${{ steps.version.outputs.VERSION }}")
            ```
            Requires a [GitHub PAT](https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-apache-maven-registry#authenticating-to-github-packages) with `read:packages` scope in `~/.sbt/1.0/credentials.sbt`.
