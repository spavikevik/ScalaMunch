name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Release
      packages: write   # publish to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      - name: Build assembly jars
        run: sbt "cli/assembly" "mcpServer/assembly"

      - name: Publish sbt plugin + MCP server to GitHub Packages
        run: sbt sbtScalaMunch/publish mcpServer/publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ScalaMunch ${{ steps.version.outputs.VERSION }}"
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            cli/target/scala-3.3.3/scala-munch-cli-assembly.jar
            mcp-server/target/scala-3.3.3/scala-munch-mcp-assembly.jar
          body: |
            ## Install

            **Prerequisites:** Java 21+

            ---

            ### Option A — Download from Assets (no build required)

            Download `scala-munch-cli-assembly.jar` and `scala-munch-mcp-assembly.jar` from the Assets below.

            ```bash
            java -jar scala-munch-cli-assembly.jar build src/main/scala --db .scala-munch.db
            java -jar scala-munch-mcp-assembly.jar --db .scala-munch.db   # MCP stdio server
            ```

            ---

            ### Option B — GitHub Packages (MCP server + sbt plugin)

            The MCP server jar and sbt plugin are published to GitHub Packages.
            Requires a [GitHub PAT](https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-apache-maven-registry#authenticating-to-github-packages) with `read:packages` in `~/.sbt/1.0/credentials.sbt`:

            ```scala
            credentials += Credentials("GitHub Package Registry", "maven.pkg.github.com",
              "<your-github-username>", "<your-PAT>")
            ```

            **Claude Code / Copilot — reference jar directly in MCP config:**

            `~/.claude/mcp.json` (global, works across all projects):
            ```json
            {
              "mcpServers": {
                "scala-munch": {
                  "type": "stdio",
                  "command": "java",
                  "args": ["-jar", "/path/to/scala-munch-mcp_3-${{ steps.version.outputs.VERSION }}.jar",
                            "--db", ".scala-munch.db"]
                }
              }
            }
            ```

            **sbt plugin** — auto-index after `sbt compile`:

            In `project/plugins.sbt`:
            ```scala
            resolvers += "GitHub Packages" at "https://maven.pkg.github.com/spavikevik/ScalaMunch"
            addSbtPlugin("io.scalamunch" % "sbt-scala-munch" % "${{ steps.version.outputs.VERSION }}")
            ```

            In `build.sbt`:
            ```scala
            .enablePlugins(ScalaMunchPlugin)
            ```

            ---

            ### Option C — Clone and build

            ```bash
            git clone https://github.com/spavikevik/ScalaMunch
            cd ScalaMunch
            bin/install.sh
            ```
